<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Conduit">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#18181B">
  <title>Conduit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
(()=> {
  var v,o,root,keys,i,vt,meta;
  try{
    v=localStorage.getItem("conduit-theme-vars");
    if(!v)return;
    o=JSON.parse(v);root=document.documentElement;keys=Object.keys(o);
    for(i=0;i<keys.length;i++)root.style.setProperty(keys[i],o[keys[i]]);
    vt=localStorage.getItem("conduit-theme-variant");
    if(vt==="light")root.classList.add("light-theme");
    else if(vt==="dark")root.classList.add("dark-theme");
    meta=document.querySelector('meta[name="theme-color"]');
    if(meta&&o["--color-bg"])meta.setAttribute("content",o["--color-bg"]);
  }catch(_e){}
})();
</script>
  <link rel="stylesheet" href="/style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon.ico" sizes="48x48">
  <link rel="icon" href="/static/favicon-96x96.png" sizes="96x96" type="image/png">
</head>
<body>
  <div id="app"></div>
  <div id="boot-screen" role="status" style="position:fixed;inset:0;display:grid;place-content:center;padding:24px;background:#18181b;color:#fafafa;font:16px/1.6 system-ui;z-index:9999">
    <h1 style="font-size:24px">Opening Conduit…</h1>
    <p id="boot-detail">Connecting to your workspace.</p>
    <button id="boot-reload" hidden style="padding:12px 20px;font:inherit;cursor:pointer">Reload Conduit</button>
  </div>
  <script>
  (() => {
    const screen = document.getElementById("boot-screen");
    const button = document.getElementById("boot-reload");
    function failed() {
      if (!screen.isConnected) return;
      screen.querySelector("h1").textContent = "Conduit could not open";
      document.getElementById("boot-detail").textContent = "Check your connection, then reload. Saved drafts remain on this device.";
      button.hidden = false;
    }
    button.addEventListener("click", () => location.reload());
    window.addEventListener("error", failed, true);
    window.addEventListener("unhandledrejection", failed);
    setTimeout(failed, 12000);
  })();
  </script>
  <script type="module" src="/app-entry.ts"></script>
</body>
</html>
