use_default_settings:
  engines:
    keep_only:
      - brave
      - duckduckgo
      - wikipedia
      - bing

general:
  contact_url: https://github.com/ethanfossett/conduit-opencode

engines:
  - name: brave
    disabled: false
  - name: bing
    disabled: false
  - name: wikipedia
    display_type: ["list"]

server:
  limiter: false
  image_proxy: false
  public_instance: false

search:
  formats:
    - html
    - json
  autocomplete: ""

outgoing:
  request_timeout: 6.0
  max_request_timeout: 9.0
  retries: 0
  proxies:
    all://:
      - socks5h://10.64.0.1:1080
